<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Agent — uni plugin</title>
  <!-- SKELETON. Markup, <link>, <script type="module"> — nothing else. The
       uni injects the theme before this line, so var(--uni-*) resolves here. -->
  <link rel="stylesheet" href="app.css" />
  <script type="module" src="app.js"></script>
</head>
<body>

<header class="head">
  <h1>Agent</h1>
  <span class="state">
    <span class="dot" id="state-dot" aria-hidden="true"></span>
    <span class="t-think" id="state-think" role="status" hidden></span>
    <span id="state-text">no model connected yet</span>
  </span>
</header>

<div class="log" id="log">
  <div class="empty" id="empty">
    <div class="tag">agent</div>
    <p><strong>Say something.</strong> The uni doesn't call a model yet, so the
    agent can't answer — but this transcript is real: your turns are kept, the
    prompt bar works, and the agent picks up the thread as soon as a model is
    connected. Type <code>/</code> for commands and <code>@</code> to attach.</p>
  </div>
  <div class="turns" id="turns" hidden></div>
</div>

<div class="bar-zone">
  <!-- Jump to latest: fixed above the prompt, where the thumb already is. -->
  <button type="button" class="jump" id="jump-btn" aria-label="Jump to latest message" hidden>
    <svg class="icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M5 8l5 5 5-5" />
    </svg>
    <span class="unread" id="jump-unread" aria-hidden="true"></span>
  </button>

  <form class="prompt" id="prompt" autocomplete="off">
    <!-- Menus: one element, two modes — @ sources, / commands. -->
    <div class="menu" id="menu" hidden role="listbox" aria-label="Suggestions"></div>

    <div class="chips" id="chips" hidden></div>

    <div class="shell">
      <textarea id="input" rows="1" placeholder="ask anything" aria-label="Message the agent"></textarea>
      <span class="cluster">
        <input type="file" id="file-input" multiple hidden />
        <button type="button" class="key" id="plus-btn" aria-label="Attach files or sources" aria-expanded="false">
          <svg class="icon" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 4.5v11M4.5 10h11" />
          </svg>
        </button>
        <button type="submit" class="send" id="send-btn" aria-label="Send message" disabled>
          <span class="glyph" aria-hidden="true">
            <svg class="icon g-send" width="18" height="18" viewBox="0 0 24 24">
              <path d="M12 4.5 18.5 11 14.25 11 14.25 19.5 9.75 19.5 9.75 11 5.5 11Z" />
            </svg>
            <svg class="icon g-stop" width="18" height="18" viewBox="0 0 24 24">
              <path d="M12 6 18 6 18 12 18 18 6 18 6 12 6 6Z" />
            </svg>
          </span>
        </button>
      </span>
    </div>
  </form>
</div>
</body>
</html>
